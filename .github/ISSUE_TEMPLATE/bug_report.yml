name: Bug report
description: Something in QuickMD doesn't work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a note with ...
        2. Type ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample Markdown
      description: The smallest piece of Markdown that shows the problem, if it is about rendering or editing.
      render: markdown
  - type: input
    id: quickmd
    attributes:
      label: QuickMD version
      description: QuickMD › About QuickMD, or the commit you built from.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g. macOS 15.2, Apple silicon"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
